[package]
name = "kortex-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = []
local-embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
serde_json.workspace = true
candle-core = { version = "=0.11.1", default-features = false, optional = true }
candle-nn = { version = "=0.11.1", default-features = false, optional = true }
candle-transformers = { version = "=0.11.1", default-features = false, optional = true }
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"], optional = true }
serde.workspace = true
blake3.workspace = true
kortex-core.workspace = true
kortex-storage.workspace = true

[dev-dependencies]
tempfile.workspace = true
kortex-indexer.workspace = true
kortex-config.workspace = true

[lints]
workspace = true
