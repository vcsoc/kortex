[package]
name = "kortex-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = []
local-embeddings = ["dep:tract-onnx", "dep:safetensors", "dep:unicode-normalization", "dep:unicode-general-category"]

[dependencies]
serde_json.workspace = true
# Fixed first-party BERT graph only; no supplied ONNX graphs, transformers extras or hub clients.
# tract: MIT OR Apache-2.0; safetensors: Apache-2.0; Unicode helpers: MIT OR Apache-2.0.
tract-onnx = { version = "=0.23.10", default-features = false, optional = true }
safetensors = { version = "=0.8.0", default-features = false, features = ["alloc"], optional = true }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"], optional = true }
unicode-general-category = { version = "=1.1.0", optional = true }
serde.workspace = true
blake3.workspace = true
kortex-core.workspace = true
kortex-storage.workspace = true
kortex-repo.workspace = true
kortex-config.workspace = true
# Existing audited workspace SQLite; cache ownership stays in search (no storage->search cycle).
rusqlite.workspace = true

# Safe nonblocking artifact opens refuse FIFO substitution; already audited workspace chain.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile.workspace = true
kortex-indexer.workspace = true

[lints]
workspace = true
