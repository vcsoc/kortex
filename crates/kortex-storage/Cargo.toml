[package]
name = "kortex-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
kortex-core.workspace = true
# Shared descriptor-relative placement/capability policy; existing workspace crate.
kortex-repo.workspace = true
rusqlite.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true

# Safe effective-UID and O_NOFOLLOW access; rustix 1.1.6 is already locked.
# MIT OR Apache-2.0 WITH LLVM-exception OR Apache-2.0; no network/runtime code loading.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }

# Safe MoveFileW binding: refuses existing destinations, including during rollback.
# MIT; kernel-only, no GUI/network features or transitive dependencies.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
tempfile.workspace = true
# Existing independent parser/resolver crates, only for actual-source equivalence diagnostics.
kortex-parse.workspace = true
kortex-languages.workspace = true

[lints]
workspace = true
