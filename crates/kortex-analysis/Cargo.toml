[package]
name = "kortex-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = []
local-embeddings = ["kortex-search/local-embeddings"]

[dependencies]
kortex-core.workspace = true
kortex-config.workspace = true
kortex-repo.workspace = true
kortex-storage.workspace = true
kortex-search.workspace = true
kortex-graph.workspace = true
serde_json.workspace = true
serde.workspace = true
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
# Existing workspace SQLite for real projection-corruption/pinned-reader regressions.
rusqlite.workspace = true
tempfile.workspace = true
kortex-indexer.workspace = true
jsonschema = { version = "0.33", default-features = false }
safetensors = { version = "=0.8.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
